<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background container -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="url(#cyanGrad)" stroke-opacity="0.3"/>
  
  <!-- Outer radar ring -->
  <circle cx="24" cy="24" r="16" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="24" cy="24" r="11" stroke="url(#cyanGrad)" stroke-width="2"/>
  
  <!-- Target crosshairs / Scout compass needles -->
  <path d="M24 8V13M24 35V40M8 24H13M35 24H40" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central lens core with glow -->
  <circle cx="24" cy="24" r="5" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="2.5" fill="#ffffff"/>
  
  <!-- Scout search beam -->
  <path d="M24 24L32 16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
